world: trojan-cycle
id: argos-and-the-keepsake
title:
  en-GB: Argos and the Lost Keepsake
  es-ES: Argos y el Recuerdo Perdido
  it-IT: Argo e il Ricordo Perduto
age:
  recommended: young
  also_works_for: [early]
skills:
  - observation
  - memory
  - logic
  - social-emotional
peril: gentle
adult_gm: true
dice:
  minimum: 1d6
  recommended: d20-set
players:
  min: 2
  max: 5
play_time_minutes: 25
images:
  - id: cover
    role: cover
    orientation: portrait
    prompt: >
      Two young seafaring heroes following a loyal old hound along a windswept sandy
      shore at golden hour, beached ships and a distant city wall behind, all
      searching the sand together. Warm and hopeful.
    alt:
      en-GB: Two young seafaring heroes following a loyal old hound along a windswept sandy shore at golden hour, beached ships and a distant city wall behind.
      es-ES: Dos jóvenes héroes marineros que siguen a un viejo y fiel sabueso por una orilla de arena ventosa al atardecer dorado, con naves varadas y una muralla lejana detrás.
      it-IT: Due giovani eroi marinari che seguono un vecchio e fedele cane lungo una riva di sabbia ventosa nell'ora dorata, con navi in secca e una muraglia lontana dietro.
  - id: scene-following-argos
    role: scene
    orientation: landscape
    canon_ref: argos-hound
    prompt: >
      A loyal old hound nose-down following a trail along a sandy beach, two small
      heroes walking close behind reading the tracks in the sand, ships beached
      nearby. Gentle and warm.
    alt:
      en-GB: A loyal old hound nose-down following a trail along a sandy beach, two small heroes close behind reading the tracks, ships beached nearby.
      es-ES: Un viejo y fiel sabueso que sigue un rastro con el hocico pegado a la arena, con dos héroes pequeños detrás leyendo las huellas y naves varadas cerca.
      it-IT: Un vecchio e fedele cane che segue una traccia con il naso a terra su una spiaggia di sabbia, con due piccoli eroi dietro che leggono le orme e navi in secca lì vicino.
  - id: scene-tide-pools
    role: scene
    orientation: landscape
    canon_ref: ship-camp
    prompt: >
      Two small heroes searching among sunlit rock pools along the shore near the
      beached ships, sorting shells and looking carefully, an old hound watching.
      Curious and bright.
    alt:
      en-GB: Two small heroes searching among sunlit rock pools near the beached ships, sorting shells and looking carefully, an old hound watching.
      es-ES: Dos héroes pequeños que buscan entre charcas de roca soleadas junto a las naves varadas, ordenando conchas y mirando con atención, mientras un viejo sabueso observa.
      it-IT: Due piccoli eroi che cercano tra pozze di scoglio assolate vicino alle navi in secca, ordinando conchiglie e guardando con attenzione, mentre un vecchio cane osserva.
  - id: scene-far-dune
    role: scene
    orientation: landscape
    canon_ref: argos-hound
    prompt: >
      A loyal old hound gently digging a small carved keepsake out of the windblown
      sand by a lonely dune, two small heroes kneeling beside him delighted. Tender
      and joyful.
    alt:
      en-GB: A loyal old hound gently digging a small carved keepsake out of the sand by a lonely dune, two small heroes kneeling delighted beside him.
      es-ES: Un viejo y fiel sabueso que desentierra con cuidado un pequeño recuerdo tallado de la arena junto a una duna solitaria, con dos héroes pequeños arrodillados a su lado, encantados.
      it-IT: Un vecchio e fedele cane che dissotterra con delicatezza un piccolo ricordo intagliato dalla sabbia accanto a una duna solitaria, con due piccoli eroi inginocchiati accanto, felici.
  - id: scene-nobody-left-behind
    role: scene
    orientation: landscape
    canon_ref: thetis-sea-mother
    prompt: >
      A friend joyfully reunited with a small carved keepsake on the beach at sunset,
      the old hound wagging happily, two small heroes smiling, a gentle sea goddess
      looking on warmly from the bright waves. Joyful and warm.
    alt:
      en-GB: A friend joyfully reunited with a small keepsake on the beach at sunset, the old hound wagging, two small heroes smiling, a gentle sea goddess looking on from the waves.
      es-ES: Un amigo que recupera con alegría un pequeño recuerdo en la playa al atardecer, con el viejo sabueso moviendo la cola, dos héroes que sonríen y una dulce diosa del mar que observa desde las olas.
      it-IT: Un amico che ritrova con gioia un piccolo ricordo sulla spiaggia al tramonto, con il vecchio cane che scodinzola, due piccoli eroi che sorridono e una dolce dea del mare che guarda dalle onde.
