# World-flavour vocabulary: the three hero qualities (this world has no magic).

- id: imagination
  names:
    en-GB: Imagination
    es-ES: Imaginación
    it-IT: Immaginazione
    pt-PT: Imaginação
  kind: quality
  description:
    en-GB: Imagining ideas and trying them. On these shores, a good idea ends a quarrel that a thousand spears never could.
    es-ES: Imaginar ideas y probarlas. En estas costas, una buena idea pone fin a una disputa que mil lanzas jamás podrían.
    it-IT: Immaginare idee e provarle. Su queste coste, una buona idea pone fine a una lite che mille lance non potrebbero mai.
    pt-PT: Imaginar ideias e experimentá-las. Nestas costas, uma boa ideia põe fim a uma discórdia que mil lanças jamais conseguiriam.
  first_seen: the-great-wooden-horse

- id: courage
  names:
    en-GB: Courage
    es-ES: Valor
    it-IT: Coraggio
    pt-PT: Coragem
  kind: quality
  description:
    en-GB: A steady heart on a wide and stormy sea. Courage is not being unafraid; it is staying kind and trying anyway, even when you are afraid.
    es-ES: Un corazón firme en un mar ancho y tormentoso. El valor no es no tener miedo; es seguir siendo amable e intentarlo igualmente, aun cuando lo tienes.
    it-IT: Un cuore saldo su un mare ampio e in tempesta. Il coraggio non è non avere paura; è restare gentili e provarci lo stesso, anche quando si ha paura.
    pt-PT: Um coração firme num mar largo e tempestuoso. A coragem não é não ter medo; é continuar a ser bondoso e tentar à mesma, mesmo quando se tem medo.
  first_seen: the-great-wooden-horse

- id: loyalty
  names:
    en-GB: Loyalty
    es-ES: Lealtad
    it-IT: Lealtà
    pt-PT: Lealdade
  kind: quality
  description:
    en-GB: Standing by your friends and leaving no one behind. The greatest heroes of the shores are the ones who keep faith, help, and find their way home together.
    es-ES: Estar al lado de tus amigos y no dejar a nadie atrás. Los mayores héroes de las costas son los que mantienen la palabra, ayudan y encuentran juntos el camino a casa.
    it-IT: Stare accanto ai tuoi amici e non lasciare indietro nessuno. I più grandi eroi delle coste sono quelli che tengono fede, aiutano e ritrovano insieme la via di casa.
    pt-PT: Estar ao lado dos teus amigos e não deixar ninguém para trás. Os maiores heróis das costas são os que mantêm a palavra, ajudam e encontram juntos o caminho de casa.
  first_seen: the-great-wooden-horse

- id: cleverness
  names:
    en-GB: Cleverness
    es-ES: Astucia
    it-IT: Astuzia
    pt-PT: Astúcia
  kind: quality
  description:
    en-GB: A quick, kind wit that finds the clever way through. On the shores of Troy, a wooden horse and a well-timed word do what ten years of fighting could not.
    es-ES: Un ingenio rápido y amable que encuentra la salida lista. En las costas de Troya, un caballo de madera y una palabra a tiempo logran lo que diez años de lucha no pudieron.
    it-IT: Un'intelligenza rapida e gentile che trova la via furba. Sulle coste di Troia, un cavallo di legno e una parola al momento giusto fanno ciò che dieci anni di guerra non poterono.
    pt-PT: Uma esperteza rápida e gentil que encontra o caminho astuto. Nas costas de Troia, um cavalo de madeira e uma palavra a tempo fazem o que dez anos de guerra não conseguiram.
  first_seen: the-great-wooden-horse

- id: patience
  names:
    en-GB: Patience
    es-ES: Paciencia
    it-IT: Pazienza
    pt-PT: Paciência
  kind: quality
  description:
    en-GB: Waiting kindly and trying again, across a long sea and a longer war. On the windswept shores, patience brings a wanderer all the way home.
    es-ES: Esperar con amabilidad y volver a intentarlo, a través de un largo mar y una guerra aún más larga. En las costas batidas por el viento, la paciencia trae a un viajero hasta casa.
    it-IT: Aspettare con gentilezza e riprovare, attraverso un lungo mare e una guerra ancora più lunga. Sulle coste battute dal vento, la pazienza riporta un viandante fino a casa.
    pt-PT: Esperar com amabilidade e tentar de novo, ao longo de um mar imenso e de uma guerra ainda mais longa. Nas costas fustigadas pelo vento, a paciência traz um viajante até casa.
  first_seen: the-long-way-home
