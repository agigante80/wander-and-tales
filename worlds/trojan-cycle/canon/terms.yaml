# World-flavour vocabulary: the three hero qualities (this world has no magic).

- id: cleverness
  names:
    en-GB: Cleverness
    es-ES: Astucia
    it-IT: Astuzia
  kind: term
  description:
    en-GB: Quick thinking and a clever plan. On these shores, a good idea ends a quarrel that a thousand spears never could.
    es-ES: Pensamiento rápido y un plan ingenioso. En estas costas, una buena idea pone fin a una disputa que mil lanzas jamás podrían.
    it-IT: Pensiero rapido e un piano ingegnoso. Su queste coste, una buona idea pone fine a una lite che mille lance non potrebbero mai.
  first_seen: the-great-wooden-horse

- id: courage
  names:
    en-GB: Courage
    es-ES: Valor
    it-IT: Coraggio
  kind: term
  description:
    en-GB: A steady heart on a wide and stormy sea. Courage is not being unafraid; it is being kind and clever even when you are afraid.
    es-ES: Un corazón firme en un mar ancho y tormentoso. El valor no es no tener miedo; es ser amable e ingenioso aun cuando lo tienes.
    it-IT: Un cuore saldo su un mare ampio e in tempesta. Il coraggio non è non avere paura; è essere gentili e ingegnosi anche quando si ha paura.
  first_seen: the-great-wooden-horse

- id: loyalty
  names:
    en-GB: Loyalty
    es-ES: Lealtad
    it-IT: Lealtà
  kind: term
  description:
    en-GB: Standing by your friends and leaving no one behind. The greatest heroes of the shores are the ones who keep faith, help, and find their way home together.
    es-ES: Estar al lado de tus amigos y no dejar a nadie atrás. Los mayores héroes de las costas son los que mantienen la palabra, ayudan y encuentran juntos el camino a casa.
    it-IT: Stare accanto ai tuoi amici e non lasciare indietro nessuno. I più grandi eroi delle coste sono quelli che tengono fede, aiutano e ritrovano insieme la via di casa.
  first_seen: the-great-wooden-horse
