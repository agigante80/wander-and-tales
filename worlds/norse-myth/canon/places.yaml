# Named places of the Snowlit Fjords of the North. Ordinary scenery is not listed here.

- id: hearth-hall
  names:
    en-GB: The Hearth Hall
    es-ES: El Salón del Hogar
    it-IT: La Sala del Focolare
  kind: place
  description:
    en-GB: The cosy turf-roofed longhouse at the heart of the village, the heroes' home, where the great hearth-fire keeps everyone warm through the long winter.
    es-ES: La acogedora casa comunal de tejado de hierba en el corazón de la aldea, el hogar de los héroes, donde el gran fuego del hogar mantiene a todos calientes durante el largo invierno.
    it-IT: L'accogliente casa lunga dal tetto d'erba nel cuore del villaggio, la casa degli eroi, dove il grande fuoco del focolare tiene tutti al caldo per tutto il lungo inverno.
  first_seen: the-long-winters-night

- id: frozen-fjord
  names:
    en-GB: The Frozen Fjord
    es-ES: El Fiordo Helado
    it-IT: Il Fiordo Ghiacciato
  kind: place
  description:
    en-GB: A long, deep arm of blue water between the mountains, frozen smooth and silver in the heart of winter, easy to cross if you are careful and kind to the ice.
    es-ES: Un largo y profundo brazo de agua azul entre las montañas, helado liso y plateado en pleno invierno, fácil de cruzar si tienes cuidado y tratas bien al hielo.
    it-IT: Un lungo e profondo braccio d'acqua azzurra tra le montagne, ghiacciato liscio e argenteo nel cuore dell'inverno, facile da attraversare se si fa attenzione e si tratta bene il ghiaccio.
  first_seen: the-long-winters-night

- id: world-tree
  names:
    en-GB: The Great World Tree
    es-ES: El Gran Árbol del Mundo
    it-IT: Il Grande Albero del Mondo
  kind: place
  description:
    en-GB: The vast tree whose roots and branches hold the whole world together, from the deep roots to the high nest of the eagle. A squirrel runs along it all day, carrying news.
    es-ES: El inmenso árbol cuyas raíces y ramas sostienen el mundo entero, desde las hondas raíces hasta el alto nido del águila. Una ardilla corre por él todo el día llevando noticias.
    it-IT: L'immenso albero le cui radici e i cui rami tengono insieme il mondo intero, dalle radici profonde all'alto nido dell'aquila. Uno scoiattolo lo percorre tutto il giorno portando notizie.
  first_seen: ratatosks-message

- id: rainbow-bridge
  names:
    en-GB: The Rainbow Bridge
    es-ES: El Puente del Arco Iris
    it-IT: Il Ponte dell'Arcobaleno
  kind: place
  description:
    en-GB: A shimmering bridge of soft colours arching from the fjords up to the high halls of the gods. It holds firm for those who cross it with a kind and honest heart.
    es-ES: Un reluciente puente de suaves colores que se arquea desde los fiordos hasta los altos salones de los dioses. Se mantiene firme para quienes lo cruzan con un corazón amable y honesto.
    it-IT: Uno scintillante ponte di colori tenui che si inarca dai fiordi fino alle alte sale degli dei. Regge saldo per chi lo attraversa con un cuore gentile e sincero.
  first_seen: the-long-winters-night

- id: whispering-pines
  names:
    en-GB: The Whispering Pines
    es-ES: Los Pinos Susurrantes
    it-IT: I Pini Sussurranti
  kind: place
  description:
    en-GB: A snowy forest of tall dark pines where the wind carries soft voices, and a friendly hearth sprite likes to play and point lost travellers the right way.
    es-ES: Un bosque nevado de altos pinos oscuros donde el viento lleva voces suaves, y a un amable duende del hogar le gusta jugar y señalar el buen camino a los viajeros perdidos.
    it-IT: Una foresta innevata di alti pini scuri dove il vento porta voci sommesse, e un gentile folletto del focolare ama giocare e indicare la via giusta ai viaggiatori smarriti.
  first_seen: the-lost-little-aurora
