- id: enchanted-spring
  names:
    en-GB: The Enchanted Spring
    es-ES: La Fuente Encantada
    it-IT: La Sorgente Incantata
    pt-PT: A Fonte Encantada
  kind: place
  description:
    en-GB: A clear spring up in the green hills, ringed with mossy stones and ferns, where the Moura Encantada lives. When all is well its water glows softly and seems almost to sing.
    es-ES: Un manantial claro en lo alto de las colinas verdes, rodeado de piedras con musgo y helechos, donde vive la Moura Encantada. Cuando todo va bien, su agua brilla suavemente y casi parece cantar.
    it-IT: Una sorgente limpida in alto fra le colline verdi, cinta di pietre muschiose e felci, dove vive la Moura Encantada. Quando tutto va bene, la sua acqua brilla dolcemente e sembra quasi cantare.
    pt-PT: Uma fonte límpida lá no alto das colinas verdes, cercada de pedras com musgo e fetos, onde vive a Moura Encantada. Quando tudo está bem, a sua água brilha suavemente e quase parece cantar.
  first_seen: mouras-lost-comb

- id: old-fountain
  names:
    en-GB: The Old Fountain
    es-ES: La Fuente Vieja
    it-IT: La Vecchia Fontana
    pt-PT: A Fonte Velha
  kind: place
  description:
    en-GB: The mossy stone fountain in the middle of the village square, fed by the Enchanted Spring up in the hills. For as long as anyone can remember its water has run clear and sweet, and the whole town gathers there.
    es-ES: La fuente de piedra cubierta de musgo en el centro de la plaza del pueblo, alimentada por la Fuente Encantada de las colinas. Desde que nadie recuerda, su agua corre clara y dulce, y todo el pueblo se reúne allí.
    it-IT: La fontana di pietra ricoperta di muschio al centro della piazza del paese, alimentata dalla Sorgente Incantata fra le colline. Da tempo immemorabile la sua acqua scorre limpida e dolce, e tutto il paese vi si raduna.
    pt-PT: A fonte de pedra coberta de musgo no meio da praça da aldeia, alimentada pela Fonte Encantada lá nas colinas. Desde que há memória a sua água corre límpida e doce, e toda a aldeia se reúne ali.
  first_seen: mouras-lost-comb

- id: barcelos
  names:
    en-GB: Barcelos
    es-ES: Barcelos
    it-IT: Barcelos
    pt-PT: Barcelos
  kind: place
  description:
    en-GB: A cheerful cobblestone town of potters and market stalls, famous as the home of the truth-telling rooster, the Galo de Barcelos.
    es-ES: Un pueblo alegre de adoquines, lleno de alfareros y puestos de mercado, famoso por ser el hogar del gallo que dice la verdad, el Galo de Barcelos.
    it-IT: Un allegro paese di ciottoli, pieno di vasai e bancarelle di mercato, famoso per essere la casa del gallo che dice la verità, il Galo de Barcelos.
    pt-PT: Uma alegre vila de calçada, cheia de oleiros e bancas de mercado, famosa por ser a casa do galo que diz a verdade, o Galo de Barcelos.
  first_seen: mouras-lost-comb

- id: serra-da-estrela
  names:
    en-GB: Serra da Estrela
    es-ES: Serra da Estrela
    it-IT: Serra da Estrela
    pt-PT: Serra da Estrela
  kind: place
  description:
    en-GB: The high Mountain of the Star, the tallest of the hills, where a kindly star once came down to befriend a lonely shepherd and gave the range its name.
    es-ES: La alta Montaña de la Estrella, la más alta de las colinas, donde una estrella bondadosa bajó una vez a hacerse amiga de un pastor solitario y dio su nombre a la sierra.
    it-IT: L'alta Montagna della Stella, la più alta delle colline, dove una stella gentile scese un tempo a fare amicizia con un pastore solitario e diede il nome alla catena.
    pt-PT: A alta Montanha da Estrela, a mais alta das colinas, onde uma estrela bondosa desceu uma vez para se tornar amiga de um pastor solitário e deu o nome à serra.
  first_seen: mouras-lost-comb

- id: bell-tower
  names:
    en-GB: The Old Bell Tower
    es-ES: La Vieja Torre del Campanario
    it-IT: La Vecchia Torre Campanaria
    pt-PT: A Velha Torre do Sino
  kind: place
  description:
    en-GB: The tall stone bell tower over Barcelos, its top open to the wind and the swifts. High among the bells, out of reach of the noisy square, the shy jackdaw keeps her glittering nest.
    es-ES: La alta torre de piedra del campanario sobre Barcelos, con la cima abierta al viento y a los vencejos. Allá arriba entre las campanas, lejos del bullicio de la plaza, la tímida grajilla guarda su nido reluciente.
    it-IT: L'alta torre di pietra del campanile sopra Barcelos, con la cima aperta al vento e ai rondoni. Lassù tra le campane, lontano dal trambusto della piazza, la timida taccola custodisce il suo nido scintillante.
    pt-PT: A alta torre de pedra do sino sobre Barcelos, com o topo aberto ao vento e aos andorinhões. Lá no alto entre os sinos, longe da azáfama da praça, a tímida gralha guarda o seu ninho reluzente.
  first_seen: galos-silent-dawn

- id: coimbra
  names:
    en-GB: Coimbra
    es-ES: Coimbra
    it-IT: Coimbra
    pt-PT: Coimbra
  kind: place
  description:
    en-GB: The old riverside city of stone streets and a hilltop castle, where good Queen Isabel once lived and carried bread to the poor. Its lanes wind down to the water, and in spring the air smells of oranges and roses.
    es-ES: La vieja ciudad junto al río, de calles de piedra y un castillo en lo alto, donde vivió la buena Reina Isabel y llevaba pan a los pobres. Sus callejuelas bajan serpenteando hasta el agua, y en primavera el aire huele a naranjas y rosas.
    it-IT: La vecchia città in riva al fiume, di strade di pietra e un castello in cima al colle, dove visse la buona Regina Isabella e portava il pane ai poveri. I suoi vicoli scendono serpeggiando fino all'acqua, e in primavera l'aria profuma di arance e rose.
    pt-PT: A velha cidade à beira do rio, de ruas de pedra e um castelo no alto, onde viveu a boa Rainha Isabel e levava pão aos pobres. As suas vielas descem a serpentear até à água, e na primavera o ar cheira a laranjas e rosas.
  first_seen: queen-isabels-roses
