- id: magic-bloom
  names:
    en-GB: Bloom
    es-ES: Floración
    it-IT: Fioritura
    pt-PT: Floração
  kind: quality
  description:
    en-GB: Make flowers and good things grow, and turn a hard, prickly moment soft and kind.
    es-ES: Haz crecer flores y cosas buenas, y convierte un momento difícil y áspero en algo suave y amable.
    it-IT: Fai crescere fiori e cose belle, e trasforma un momento difficile e spinoso in qualcosa di morbido e gentile.
    pt-PT: Faz crescer flores e coisas boas, e transforma um momento difícil e espinhoso em algo suave e bondoso.
  first_seen: mouras-lost-comb

- id: magic-truth
  names:
    en-GB: Truth
    es-ES: Verdad
    it-IT: Verità
    pt-PT: Verdade
  kind: quality
  description:
    en-GB: Show what is true and right, the way the bright rooster of Barcelos crows out the honest answer.
    es-ES: Muestra lo que es verdadero y justo, como el gallo brillante de Barcelos canta la respuesta honesta.
    it-IT: Mostra ciò che è vero e giusto, come il gallo luminoso di Barcelos canta la risposta onesta.
    pt-PT: Mostra o que é verdadeiro e justo, tal como o galo luminoso de Barcelos canta a resposta honesta.
  first_seen: mouras-lost-comb

- id: magic-starlight
  names:
    en-GB: Starlight
    es-ES: Luz de Estrella
    it-IT: Luce di Stella
    pt-PT: Luz de Estrela
  kind: quality
  description:
    en-GB: Call a small, kind light down to your hand to guide you when the way is dark.
    es-ES: Llama a una lucecita amable hasta tu mano para guiarte cuando el camino está oscuro.
    it-IT: Chiama una piccola luce gentile fino alla tua mano per guidarti quando la strada è buia.
    pt-PT: Chama uma luzinha bondosa até à tua mão para te guiar quando o caminho está escuro.
  first_seen: mouras-lost-comb

- id: magic-riversong
  names:
    en-GB: Riversong
    es-ES: Canto del Río
    it-IT: Canto del Fiume
    pt-PT: Canto do Rio
  kind: quality
  description:
    en-GB: Speak with springs, stones and running water, and listen quietly to what they tell you.
    es-ES: Habla con las fuentes, las piedras y el agua que corre, y escucha en silencio lo que te cuentan.
    it-IT: Parla con le sorgenti, le pietre e l'acqua che scorre, e ascolta in silenzio quello che ti raccontano.
    pt-PT: Fala com as fontes, as pedras e a água que corre, e escuta em silêncio o que elas te contam.
  first_seen: mouras-lost-comb

- id: magic-birdsong
  names:
    en-GB: Birdsong
    es-ES: Canto de los Pájaros
    it-IT: Canto degli Uccelli
    pt-PT: Canto dos Pássaros
  kind: quality
  description:
    en-GB: Calls the birds and understands their songs, so a shy creature can be coaxed gently into the open and a lost path can be sung back home.
    es-ES: Llama a los pájaros y entiende sus cantos, para engatusar con dulzura a una criatura tímida hasta que salga y para que un camino perdido vuelva cantando a casa.
    it-IT: Chiama gli uccelli e ne comprende i canti, così una creatura timida si può invitare con dolcezza allo scoperto e un sentiero perduto si può cantare di nuovo verso casa.
    pt-PT: Chama os pássaros e percebe os seus cantos, para com doçura trazer ao de cima uma criatura tímida e para que um caminho perdido volte a cantar para casa.
  first_seen: galos-silent-dawn
