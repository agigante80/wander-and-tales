- id: golden-comb
  names:
    en-GB: The Golden Comb
    es-ES: El Peine de Oro
    it-IT: Il Pettine d'Oro
    pt-PT: O Pente de Ouro
  kind: item
  description:
    en-GB: The Moura's comb, bright as morning. When she draws it through her long hair the spring wakes, the water runs clear, and the old fountain in the square sings again. Without it the spring goes quiet and grey.
    es-ES: El peine de la Moura, brillante como la mañana. Cuando lo pasa por su larga cabellera, el manantial despierta, el agua corre clara y la fuente vieja de la plaza vuelve a cantar. Sin él, el manantial queda callado y gris.
    it-IT: Il pettine della Moura, lucente come il mattino. Quando lo passa fra i suoi lunghi capelli, la sorgente si sveglia, l'acqua scorre limpida e la vecchia fontana della piazza torna a cantare. Senza di esso, la sorgente resta silenziosa e grigia.
    pt-PT: O pente da Moura, brilhante como a manhã. Quando o passa pelos seus longos cabelos, a fonte desperta, a água corre límpida e a fonte velha da praça volta a cantar. Sem ele, a fonte fica silenciosa e cinzenta.
  first_seen: mouras-lost-comb

- id: rosca-bread
  names:
    en-GB: Rosca Bread
    es-ES: Pan Rosca
    it-IT: Pane Rosca
    pt-PT: Pão Rosca
  kind: item
  description:
    en-GB: A sweet ring-shaped loaf from the village bakery, soft and golden, often shared at the fountain. The Trasgo cannot resist its smell.
    es-ES: Un pan dulce en forma de rosca de la panadería del pueblo, blando y dorado, que se comparte a menudo junto a la fuente. El Trasgo no puede resistirse a su olor.
    it-IT: Un pane dolce a forma di ciambella del forno del paese, morbido e dorato, che spesso si condivide accanto alla fontana. Il Trasgo non sa resistere al suo profumo.
    pt-PT: Um pão doce em forma de rosca da padaria da aldeia, fofo e dourado, partilhado muitas vezes junto à fonte. O Trasgo não resiste ao seu cheiro.
  first_seen: mouras-lost-comb

- id: silver-cup
  names:
    en-GB: The Silver Cup
    es-ES: La Copa de Plata
    it-IT: La Coppa d'Argento
    pt-PT: A Taça de Prata
  kind: item
  description:
    en-GB: The bright silver festival cup of Barcelos, polished for the dawn market and the saint's day. When it goes missing the whole town frets, though it was never stolen, only carried off by a magpie-minded jackdaw who loved its shine.
    es-ES: La reluciente copa de plata de las fiestas de Barcelos, pulida para el mercado del alba y el día del santo. Cuando desaparece, todo el pueblo se inquieta, aunque nunca la robaron: solo se la llevó una grajilla amante de los brillos.
    it-IT: La lucente coppa d'argento delle feste di Barcelos, lucidata per il mercato dell'alba e il giorno del santo. Quando sparisce, tutto il paese si agita, anche se non fu mai rubata: la portò via soltanto una taccola innamorata del suo luccichio.
    pt-PT: A reluzente taça de prata das festas de Barcelos, polida para o mercado da madrugada e o dia do santo. Quando desaparece, toda a vila se aflige, embora nunca tenha sido roubada: foi só levada por uma gralha encantada com o seu brilho.
  first_seen: galos-silent-dawn
