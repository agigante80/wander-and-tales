id: japanese-myth
name:
  en-GB: The Blossom Mountains of Yamato
  es-ES: Las Montañas en Flor de Yamato
  it-IT: I Monti in Fiore di Yamato
tone: serene wonder
palette:
  - "#fbf5f4"  # soft blossom-paper background
  - "#34507a"  # indigo (primary)
  - "#e7a6b8"  # sakura pink
  - "#4f8a5b"  # bamboo green
  - "#cf4b3a"  # lantern vermilion
  - "#d8a838"  # temple gold
  - "#7a5e96"  # twilight purple
fonts:
  default: dejavu-serif
lore_summary:
  en-GB: >
    The blossom mountains of Yamato rise in soft green folds above terraced rice
    fields and little villages strung with paper lanterns, where cherry trees drop
    their petals on the wind and red torii gates mark the quiet shrines. Mist
    drifts among the bamboo, the moon lays a silver path on the river, and the
    hills are full of gentle spirits: a riddling fox, shy fireflies who light the
    lanterns, a jolly trickster tanuki, stone guardian dogs, and a great old river
    dragon who brings the rains. Here a hero is not the strongest or the loudest,
    but the one who is patient, thinks things through, and is kind to every living
    thing. The grandest deeds are done with wisdom and courage and a gentle heart,
    and even a fearsome guardian, met with a calm and friendly word, often turns
    out kinder than it looks.
  es-ES: >
    Las montañas en flor de Yamato se alzan en suaves pliegues verdes sobre
    arrozales en terrazas y pueblecitos engalanados con faroles de papel, donde los
    cerezos dejan caer sus pétalos al viento y las puertas torii rojas señalan los
    santuarios tranquilos. La niebla flota entre el bambú, la luna tiende un camino
    plateado sobre el río y las colinas están llenas de espíritus amables: un zorro
    que plantea acertijos, luciérnagas tímidas que encienden los faroles, un alegre
    tanuki travieso, perros guardianes de piedra y un gran dragón del río que trae
    las lluvias. Aquí un héroe no es el más fuerte ni el que más grita, sino quien
    es paciente, piensa bien las cosas y es amable con todo ser vivo. Las hazañas
    más grandes se logran con sabiduría, valor y un corazón amable, y hasta un
    guardián temible, si lo afrontáis con calma y buenas palabras, a menudo resulta
    más bondadoso de lo que parece.
  it-IT: >
    I monti in fiore di Yamato si levano in morbide pieghe verdi sopra risaie a
    terrazze e piccoli villaggi addobbati di lanterne di carta, dove i ciliegi
    lasciano cadere i loro petali nel vento e i portali torii rossi segnano i
    santuari silenziosi. La nebbia fluttua tra il bambù, la luna stende un sentiero
    d'argento sul fiume, e le colline sono piene di spiriti gentili: una volpe che
    pone indovinelli, lucciole timide che accendono le lanterne, un allegro tanuki
    burlone, cani guardiani di pietra e un grande drago del fiume che porta le
    piogge. Qui un eroe non è il più forte né quello che grida di più, ma chi è
    paziente, riflette bene e si mostra gentile con ogni essere vivente. Le imprese
    più grandi si compiono con saggezza, coraggio e un cuore gentile, e persino un
    guardiano spaventoso, accolto con calma e parole gentili, spesso si rivela più
    buono di quanto sembri.
visual_style: >
  Soft, warm storybook illustration blending gentle Japanese woodblock line with
  watercolour and coloured-pencil texture, in a serene mountain mood: pale pink
  cherry blossom, terraced green rice fields, misty blue-green mountains, red torii
  gates, paper lanterns glowing warm, and a silver moon. Use a palette of blossom
  paper white (#fbf5f4), indigo (#34507a), sakura pink (#e7a6b8), bamboo green
  (#4f8a5b), lantern vermilion (#cf4b3a), temple gold (#d8a838) and twilight purple
  (#7a5e96). Rounded, friendly shapes and kind faces. Calm and hopeful, never grim:
  even great spirits look more gentle than scary, and there is no blood, no weapons
  raised in anger, and no real violence.
images:
  - id: cover
    role: cover
    orientation: portrait
    prompt: >
      A wide establishing view of the blossom mountains of Yamato at dusk: misty
      green mountains and terraced rice fields, a little village strung with glowing
      paper lanterns, a red torii gate, cherry blossom drifting on the breeze, and a
      silver moon rising. Welcoming and serene.
    alt:
      en-GB: The blossom mountains of Yamato at dusk, a village of glowing paper lanterns and a red torii gate below misty mountains, cherry blossom drifting, a silver moon rising.
      es-ES: Las montañas en flor de Yamato al anochecer, un pueblo de faroles de papel encendidos y una puerta torii roja bajo montañas neblinosas, con pétalos de cerezo al viento y una luna plateada que asoma.
      it-IT: I monti in fiore di Yamato al crepuscolo, un villaggio di lanterne di carta accese e un portale torii rosso sotto montagne nebbiose, con petali di ciliegio nel vento e una luna d'argento che sorge.
  - id: kon-fox
    role: portrait
    orientation: square
    canon_ref: kon-fox
    prompt: >
      A friendly fox spirit with soft russet fur and bright clever eyes sitting
      among bamboo, a playful smile as if about to ask a riddle, a little leaf on its
      head. Wise and welcoming, not frightening.
    alt:
      en-GB: A friendly russet fox spirit with bright clever eyes sitting among bamboo, smiling as if about to ask a riddle.
      es-ES: Un amable espíritu zorro de pelaje rojizo y ojos vivos sentado entre el bambú, sonriendo como si fuera a plantear un acertijo.
      it-IT: Un gentile spirito volpe dal pelo rossiccio e occhi vivaci seduto tra il bambù, che sorride come se stesse per porre un indovinello.
  - id: river-dragon
    role: portrait
    orientation: square
    canon_ref: river-dragon
    prompt: >
      A great gentle river dragon with a long winding body of soft blue and green
      scales, kind sleepy eyes and flowing whiskers, curled peacefully among misty
      water and reeds. Majestic and calm, tender rather than fierce.
    alt:
      en-GB: A great gentle river dragon with soft blue-green scales, kind sleepy eyes and flowing whiskers, curled peacefully among misty water.
      es-ES: Un gran dragón del río amable, de suaves escamas azules y verdes, ojos bondadosos y soñolientos y largos bigotes, enroscado en paz entre el agua y la niebla.
      it-IT: Un grande drago del fiume gentile, dalle morbide squame azzurre e verdi, occhi buoni e assonnati e lunghi baffi, acciambellato in pace tra l'acqua e la nebbia.
