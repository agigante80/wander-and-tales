# Named characters of the Sunlit Hills of Greece.

- id: daphne-olive-keeper
  names:
    en-GB: Daphne the Olive-Keeper
    es-ES: Dafne la Guardiana de los Olivos
    it-IT: Dafne la Guardiana degli Ulivi
    pt-PT: Dafne a Guardiã das Oliveiras
  kind: character
  disposition: friendly
  description:
    en-GB: The kind old keeper of the town's olive grove, who knows every story of the hills and sends the heroes to wake the spring.
    es-ES: La amable y anciana guardiana del olivar del pueblo, que conoce todas las historias de las colinas y envía a los héroes a despertar la fuente.
    it-IT: La gentile e anziana guardiana dell'uliveto del paese, che conosce ogni storia delle colline e manda gli eroi a risvegliare la fonte.
    pt-PT: A meiga e idosa guardiã do olival da vila, que conhece todas as histórias das colinas e envia os heróis a despertar a fonte.
  first_seen: the-singing-spring

- id: athena
  names:
    en-GB: Athena
    es-ES: Atenea
    it-IT: Atena
    pt-PT: Atena
  kind: character
  disposition: kindly
  description:
    en-GB: The goddess of good ideas and kindness, who smiles on heroes that win by imagining and caring rather than by force.
    es-ES: La diosa de las buenas ideas y de la amabilidad, que sonríe a los héroes que vencen imaginando y cuidando, no por la fuerza.
    it-IT: La dea delle buone idee e della gentilezza, che sorride agli eroi che vincono immaginando e prendendosi cura degli altri, non con la forza.
    pt-PT: A deusa das boas ideias e da bondade, que sorri aos heróis que vencem imaginando e cuidando dos outros, e não pela força.
  first_seen: the-singing-spring

- id: milo-baker
  names:
    en-GB: Milo the Baker
    es-ES: Milo el Panadero
    it-IT: Milo il Fornaio
    pt-PT: Milo o Padeiro
  kind: character
  disposition: friendly
  description:
    en-GB: The cheerful town baker, who fills the Olive Town with the smell of fresh bread and bakes the great honey cake for the feast.
    es-ES: El alegre panadero del pueblo, que llena el Pueblo de los Olivos de olor a pan recién hecho y hornea el gran pastel de miel para el banquete.
    it-IT: L'allegro fornaio del paese, che riempie il Paese degli Ulivi del profumo di pane fresco e prepara la grande focaccia al miele per la festa.
    pt-PT: O padeiro alegre da vila, que enche a Vila das Oliveiras com o cheiro a pão fresco e prepara o grande bolo de mel para a festa.
  first_seen: honey-cake-feast
