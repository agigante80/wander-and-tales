# World-flavour vocabulary: the three hero qualities (this world has no magic).

- id: imagination
  names:
    en-GB: Imagination
    es-ES: Imaginación
    it-IT: Immaginazione
    pt-PT: Imaginação
  kind: quality
  description:
    en-GB: Imagining new ideas and asking good questions. In these hills, a fresh idea opens more doors than strength, and there is no wrong idea.
    es-ES: Imaginar ideas nuevas y hacer buenas preguntas. En estas colinas, una idea nueva abre más puertas que la fuerza, y aquí no hay ideas equivocadas.
    it-IT: Immaginare idee nuove e fare buone domande. Su queste colline, un'idea nuova apre più porte della forza, e qui non ci sono idee sbagliate.
    pt-PT: Imaginar ideias novas e fazer boas perguntas. Nestas colinas, uma ideia nova abre mais portas do que a força, e aqui não há ideias erradas.
  first_seen: the-singing-spring

- id: courage
  names:
    en-GB: Courage
    es-ES: Valor
    it-IT: Coraggio
    pt-PT: Coragem
  kind: quality
  description:
    en-GB: A steady heart in a scary moment. Courage is not being unafraid; it is staying kind and trying anyway, even when you are afraid.
    es-ES: Un corazón firme en un momento de miedo. El valor no es no tener miedo; es seguir siendo amable e intentarlo igualmente, aun cuando lo tienes.
    it-IT: Un cuore saldo in un momento di paura. Il coraggio non è non avere paura; è restare gentili e provarci lo stesso, anche quando si ha paura.
    pt-PT: Um coração firme num momento de medo. A coragem não é não ter medo; é continuar a ser meigo e tentar à mesma, mesmo quando temos medo.
  first_seen: the-singing-spring

- id: heart
  names:
    en-GB: Heart
    es-ES: Corazón
    it-IT: Cuore
    pt-PT: Coração
  kind: quality
  description:
    en-GB: Care for others. In this world the greatest heroes are the ones who help, share, and stand by a friend.
    es-ES: El cuidado por los demás. En este mundo, los mayores héroes son los que ayudan, comparten y no abandonan a un amigo.
    it-IT: La cura per gli altri. In questo mondo i più grandi eroi sono quelli che aiutano, condividono e non abbandonano un amico.
    pt-PT: O cuidado pelos outros. Neste mundo, os maiores heróis são os que ajudam, partilham e nunca abandonam um amigo.
  first_seen: the-singing-spring

- id: curiosity
  names:
    en-GB: Curiosity
    es-ES: Curiosidad
    it-IT: Curiosità
    pt-PT: Curiosidade
  kind: quality
  description:
    en-GB: Asking the right question and noticing what others miss. Under the bright Greek sun, a curious eye spots the small clue that solves the whole puzzle.
    es-ES: Hacer la pregunta justa y fijarse en lo que otros no ven. Bajo el sol brillante de Grecia, un ojo curioso descubre la pequeña pista que resuelve todo el enigma.
    it-IT: Fare la domanda giusta e notare ciò che gli altri non vedono. Sotto il sole splendente della Grecia, un occhio curioso scopre il piccolo indizio che risolve l'intero enigma.
    pt-PT: Fazer a pergunta certa e reparar no que os outros não veem. Sob o sol brilhante da Grécia, um olho curioso descobre a pequena pista que resolve todo o enigma.
  first_seen: athenas-owl

- id: cleverness
  names:
    en-GB: Cleverness
    es-ES: Astucia
    it-IT: Astuzia
    pt-PT: Astúcia
  kind: quality
  description:
    en-GB: A quick, kind wit that finds the clever way through. In the land of Athena, a bright idea outshines brute strength every time.
    es-ES: Un ingenio rápido y amable que encuentra la salida lista. En la tierra de Atenea, una idea brillante supera siempre a la fuerza bruta.
    it-IT: Un'intelligenza rapida e gentile che trova la via furba. Nella terra di Atena, un'idea brillante batte ogni volta la forza bruta.
    pt-PT: Uma esperteza rápida e gentil que encontra o caminho astuto. Na terra de Atena, uma ideia brilhante supera sempre a força bruta.
  first_seen: athenas-owl
