# World-flavour vocabulary: the three hero qualities (this world has no magic).

- id: imagination
  names:
    en-GB: Imagination
    es-ES: Imaginación
    it-IT: Immaginazione
  kind: quality
  description:
    en-GB: Imagining new ideas and asking good questions. In these hills, a fresh idea opens more doors than strength, and there is no wrong idea.
    es-ES: Imaginar ideas nuevas y hacer buenas preguntas. En estas colinas, una idea nueva abre más puertas que la fuerza, y aquí no hay ideas equivocadas.
    it-IT: Immaginare idee nuove e fare buone domande. Su queste colline, un'idea nuova apre più porte della forza, e qui non ci sono idee sbagliate.
  first_seen: the-singing-spring

- id: courage
  names:
    en-GB: Courage
    es-ES: Valor
    it-IT: Coraggio
  kind: quality
  description:
    en-GB: A steady heart in a scary moment. Courage is not being unafraid; it is staying kind and trying anyway, even when you are afraid.
    es-ES: Un corazón firme en un momento de miedo. El valor no es no tener miedo; es seguir siendo amable e intentarlo igualmente, aun cuando lo tienes.
    it-IT: Un cuore saldo in un momento di paura. Il coraggio non è non avere paura; è restare gentili e provarci lo stesso, anche quando si ha paura.
  first_seen: the-singing-spring

- id: heart
  names:
    en-GB: Heart
    es-ES: Corazón
    it-IT: Cuore
  kind: quality
  description:
    en-GB: Care for others. In this world the greatest heroes are the ones who help, share, and stand by a friend.
    es-ES: El cuidado por los demás. En este mundo, los mayores héroes son los que ayudan, comparten y no abandonan a un amigo.
    it-IT: La cura per gli altri. In questo mondo i più grandi eroi sono quelli che aiutano, condividono e non abbandonano un amico.
  first_seen: the-singing-spring
