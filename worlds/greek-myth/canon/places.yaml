# Named places of the Sunlit Hills of Greece. Ordinary scenery is not listed here.

- id: olive-town
  names:
    en-GB: The Olive Town
    es-ES: El Pueblo de los Olivos
  kind: place
  description:
    en-GB: A little white town of terracotta roofs and olive trees, the heroes' home, where the spring has fallen quiet.
    es-ES: Un pueblecito blanco de tejados de terracota y olivos, el hogar de los héroes, donde la fuente se ha quedado en silencio.
  first_seen: the-singing-spring

- id: riddle-gate
  names:
    en-GB: The Riddle Gate
    es-ES: La Puerta de los Acertijos
  kind: place
  description:
    en-GB: A marble gate on the hill road, guarded by a sphinx who lets pass only those who answer a riddle with a cool head.
    es-ES: Una puerta de mármol en el camino de la colina, custodiada por una esfinge que solo deja pasar a quienes responden a un acertijo con la cabeza fría.
  first_seen: the-singing-spring

- id: winding-maze
  names:
    en-GB: The Winding Maze
    es-ES: El Laberinto Sinuoso
  kind: place
  description:
    en-GB: A maze of old stone walls and hedges where it is easy to get lost without a thread to follow.
    es-ES: Un laberinto de viejos muros de piedra y setos donde es fácil perderse sin un hilo que seguir.
  first_seen: the-singing-spring

- id: singing-spring
  names:
    en-GB: The Singing Spring
    es-ES: La Fuente Cantarina
  kind: place
  description:
    en-GB: The spring of the nymphs high in the hills, whose song once filled every well in the valley. It has gone silent.
    es-ES: La fuente de las ninfas en lo alto de las colinas, cuyo canto antes llenaba cada pozo del valle. Se ha quedado callada.
  first_seen: the-singing-spring

- id: mount-olympus
  names:
    en-GB: Mount Olympus
    es-ES: El Monte Olimpo
  kind: place
  description:
    en-GB: The cloud-wrapped mountain where the gods live, watching over the sunlit hills from far above.
    es-ES: La montaña envuelta en nubes donde viven los dioses, que velan por las colinas soleadas desde muy alto.
  first_seen: the-singing-spring
