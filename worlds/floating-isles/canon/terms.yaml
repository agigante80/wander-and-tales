# World-flavour vocabulary for the Floating Isles: the four magics.
# Magic on the Isles only ever helps; it never harms.

- id: magic-light
  names:
    en-GB: Light
    es-ES: Luz
    it-IT: Luce
    pt-PT: Luz
  kind: quality
  description:
    en-GB: Reveals what is hidden and calms frightened creatures.
    es-ES: Revela lo que está escondido y calma a las criaturas asustadas.
    it-IT: Rivela ciò che è nascosto e calma le creature spaventate.
    pt-PT: Revela o que está escondido e acalma as criaturas assustadas.
  first_seen: sleeping-garden

- id: magic-grow
  names:
    en-GB: Grow
    es-ES: Crecer
    it-IT: Crescita
    pt-PT: Crescer
  kind: quality
  description:
    en-GB: Makes plants, bridges and paths grow so nobody is ever stuck.
    es-ES: Hace crecer plantas, puentes y caminos para que nadie se quede atascado.
    it-IT: Fa crescere piante, ponti e sentieri così nessuno resta mai bloccato.
    pt-PT: Faz crescer plantas, pontes e caminhos para que ninguém fique preso.
  first_seen: sleeping-garden

- id: magic-change
  names:
    en-GB: Change
    es-ES: Cambio
    it-IT: Cambiamento
    pt-PT: Transformação
  kind: quality
  description:
    en-GB: Turns one object into another, such as a stone into a key.
    es-ES: Convierte un objeto en otro, por ejemplo una piedra en una llave.
    it-IT: Trasforma un oggetto in un altro, per esempio una pietra in una chiave.
    pt-PT: Transforma um objeto noutro, por exemplo uma pedra numa chave.
  first_seen: sleeping-garden

- id: magic-voice
  names:
    en-GB: Voice
    es-ES: Voz
    it-IT: Voce
    pt-PT: Voz
  kind: quality
  description:
    en-GB: Lets you speak with animals and objects, and ask them kindly for help.
    es-ES: Permite hablar con los animales y los objetos, y pedirles ayuda con amabilidad.
    it-IT: Permette di parlare con gli animali e gli oggetti, e di chiedere loro aiuto con gentilezza.
    pt-PT: Permite falar com os animais e os objetos, e pedir-lhes ajuda com gentileza.
  first_seen: sleeping-garden

- id: festival-of-lights
  names:
    en-GB: The Festival of Lights
    es-ES: La Fiesta de las Luces
    it-IT: La Festa delle Luci
    pt-PT: A Festa das Luzes
  kind: term
  description:
    en-GB: The evening when the families of the Isles send glowing sky lanterns up into the calm sky together.
    es-ES: La noche en que las familias de las Islas hacen subir juntas faroles del cielo luminosos al cielo tranquilo.
    it-IT: La sera in cui le famiglie delle Isole fanno salire insieme lanterne del cielo luminose nel cielo tranquillo.
    pt-PT: A noite em que as famílias das Ilhas fazem subir juntas lanternas do céu luminosas para o céu tranquilo.
  first_seen: lantern-festival

- id: magic-float
  names:
    en-GB: Float
    es-ES: Flotar
    it-IT: Fluttuare
    pt-PT: Flutuar
  kind: quality
  description:
    en-GB: Lifts and floats heavy things gently up into the air, the way the isles themselves drift on the sky. A stuck cart or a fallen friend rises light as a feather.
    es-ES: Eleva y hace flotar con suavidad las cosas pesadas por el aire, como las propias islas que van a la deriva por el cielo. Un carro atascado o un amigo caído se alza ligero como una pluma.
    it-IT: Solleva e fa fluttuare con dolcezza le cose pesanti nell'aria, come le isole stesse che vanno alla deriva nel cielo. Un carro bloccato o un amico caduto si alza leggero come una piuma.
    pt-PT: Eleva e faz flutuar com suavidade as coisas pesadas pelo ar, como as próprias ilhas que vagueiam pelo céu. Um carro preso ou um amigo caído ergue-se leve como uma pena.
  first_seen: lantern-festival
