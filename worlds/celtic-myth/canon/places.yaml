# Named places of the Emerald Isles of the Celts. Ordinary scenery is not listed here.

- id: roundhouse
  names:
    en-GB: The Roundhouse
    es-ES: La Casa Redonda
    it-IT: La Casa Rotonda
  kind: place
  description:
    en-GB: The cosy thatched roundhouse at the heart of the village, the heroes' home, with a warm hearth in the middle and stories told around it every night.
    es-ES: La acogedora casa redonda de techo de paja en el corazón de la aldea, el hogar de los héroes, con un cálido fuego en el centro y cuentos que se narran cada noche a su alrededor.
    it-IT: L'accogliente casa rotonda dal tetto di paglia nel cuore del villaggio, la casa degli eroi, con un caldo focolare al centro e storie raccontate ogni sera attorno ad esso.
  first_seen: pooks-tangled-paths

- id: oak-grove
  names:
    en-GB: The Whispering Oak Grove
    es-ES: El Robledal Susurrante
    it-IT: Il Querceto Sussurrante
  kind: place
  description:
    en-GB: An ancient wood of great oak trees where the faeries play, the leaves whisper old secrets, and the winding paths can tangle for anyone without a thread to follow.
    es-ES: Un bosque antiguo de grandes robles donde juegan las hadas, las hojas susurran viejos secretos y los senderos sinuosos pueden enredarse para quien no tenga un hilo que seguir.
    it-IT: Un bosco antico di grandi querce dove giocano le fate, le foglie sussurrano vecchi segreti e i sentieri tortuosi possono aggrovigliarsi per chi non ha un filo da seguire.
  first_seen: pooks-tangled-paths

- id: standing-stones
  names:
    en-GB: The Ring of Standing Stones
    es-ES: El Círculo de Piedras
    it-IT: Il Cerchio di Pietre
  kind: place
  description:
    en-GB: An ancient ring of tall grey stones on a green rise that hums softly at dawn and dusk, and listens when the swan children sing.
    es-ES: Un antiguo círculo de altas piedras grises sobre una loma verde que zumba suavemente al amanecer y al anochecer, y escucha cuando cantan los niños cisne.
    it-IT: Un antico cerchio di alte pietre grigie su un'altura verde che vibra piano all'alba e al crepuscolo, e ascolta quando cantano i bambini cigno.
  first_seen: swan-childrens-lullaby

- id: misty-loch
  names:
    en-GB: The Misty Loch
    es-ES: El Lago Brumoso
    it-IT: Il Lago Nebbioso
  kind: place
  description:
    en-GB: A still grey lake often wrapped in soft mist, home to the old salmon and the shy selkie, where a boat may slip across to the Land of Youth.
    es-ES: Un lago gris y quieto, a menudo envuelto en una niebla suave, hogar del viejo salmón y de la tímida foca encantada, desde donde una barca puede cruzar hasta la Tierra de la Juventud.
    it-IT: Un lago grigio e immobile, spesso avvolto in una nebbia leggera, dimora del vecchio salmone e della timida foca incantata, da cui una barca può scivolare fino alla Terra della Giovinezza.
  first_seen: the-land-of-youth

- id: land-of-youth
  names:
    en-GB: The Land of Youth
    es-ES: La Tierra de la Juventud
    it-IT: La Terra della Giovinezza
  kind: place
  description:
    en-GB: The gentle Otherworld across the mist, once called Tir na nOg, where no one grows old, the apple trees are always in blossom, and a kind heart is the only way in.
    es-ES: El amable Otro Mundo al otro lado de la niebla, antaño llamado Tir na nOg, donde nadie envejece, los manzanos están siempre en flor y un corazón bondadoso es la única manera de entrar.
    it-IT: Il gentile Altromondo oltre la nebbia, un tempo chiamato Tir na nOg, dove nessuno invecchia, i meli sono sempre in fiore e un cuore buono è l'unico modo per entrare.
  first_seen: the-land-of-youth
