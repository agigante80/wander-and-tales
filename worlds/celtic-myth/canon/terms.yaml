# World-flavour vocabulary: the three hero qualities (this world has no magic).

- id: imagination
  names:
    en-GB: Imagination
    es-ES: Imaginación
    it-IT: Immaginazione
    pt-PT: Imaginação
  kind: quality
  description:
    en-GB: Imagining ideas and trying them. In the green isles, a good idea opens doors that force never could, and a riddle is solved with a cool head.
    es-ES: Imaginar ideas y probarlas. En las islas verdes, una buena idea abre puertas que la fuerza jamás podría, y un acertijo se resuelve con la cabeza fría.
    it-IT: Immaginare idee e provarle. Nelle isole verdi, una buona idea apre porte che la forza non potrebbe mai, e un indovinello si risolve con la testa fredda.
    pt-PT: Imaginar ideias e experimentá-las. Nas ilhas verdes, uma boa ideia abre portas que a força nunca conseguiria, e uma adivinha resolve-se com a cabeça fria.
  first_seen: pooks-tangled-paths

- id: courage
  names:
    en-GB: Courage
    es-ES: Valor
    it-IT: Coraggio
    pt-PT: Coragem
  kind: quality
  description:
    en-GB: A steady heart in a misty, scary moment. Courage is not being unafraid; it is staying kind and trying anyway, even when you are afraid.
    es-ES: Un corazón firme en un momento brumoso y de miedo. El valor no es no tener miedo; es seguir siendo amable e intentarlo igualmente, aun cuando lo tienes.
    it-IT: Un cuore saldo in un momento nebbioso e di paura. Il coraggio non è non avere paura; è restare gentili e provarci lo stesso, anche quando si ha paura.
    pt-PT: Um coração firme num momento enevoado e assustador. A coragem não é não ter medo; é continuar bondoso e tentar à mesma, mesmo quando se tem medo.
  first_seen: pooks-tangled-paths

- id: kindness
  names:
    en-GB: Kindness
    es-ES: Bondad
    it-IT: Gentilezza
    pt-PT: Bondade
  kind: quality
  description:
    en-GB: Care for every soul, faerie or friend. The greatest heroes of the isles are the ones who share, help, and keep a promise.
    es-ES: El cuidado de toda alma, sea hada o amiga. Los mayores héroes de las islas son los que comparten, ayudan y cumplen una promesa.
    it-IT: La cura per ogni anima, fata o amica. I più grandi eroi delle isole sono quelli che condividono, aiutano e mantengono una promessa.
    pt-PT: O cuidado por toda a alma, fada ou amiga. Os maiores heróis das ilhas são os que partilham, ajudam e cumprem uma promessa.
  first_seen: pooks-tangled-paths
