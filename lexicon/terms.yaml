# Repo-wide game vocabulary shared by every world.
# System terms only: the role names, the difficulty bands, and the energy star.
# World flavour (such as the four magics of the Floating Isles) lives in that
# world's canon/terms.yaml, not here.

- id: game-master
  names:
    en-GB: Game Master
    es-ES: Guía del Juego
    it-IT: Guida del Gioco
    pt-PT: Mestre do Jogo

- id: band-easy
  names:
    en-GB: Easy
    es-ES: Fácil
    it-IT: Facile
    pt-PT: Fácil

- id: band-normal
  names:
    en-GB: Normal
    es-ES: Normal
    it-IT: Normale
    pt-PT: Normal

- id: band-hard
  names:
    en-GB: Hard
    es-ES: Difícil
    it-IT: Difficile
    pt-PT: Difícil

- id: energy-star
  names:
    en-GB: energy star
    es-ES: estrella de energía
    it-IT: stella di energia
    pt-PT: estrela de energia
