[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wits-and-wonder"
version = "0.1.0"
description = "Printable cooperative story-kit library: content model and build toolchain"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.6",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
render = [
    "reportlab>=4.0",
    "cairosvg>=2.7",
    "pypdf>=4.0",
    "defusedxml>=0.7",
    "segno>=1.6",
]
images = [
    "openai>=1.0",
    "python-dotenv>=1.0",
]

[tool.setuptools]
packages = ["build", "build.render"]

[tool.setuptools.package-data]
"build" = ["assets/fonts/*.ttf"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
