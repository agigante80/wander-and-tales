name: Generate art and rebuild kits

on:
  workflow_dispatch:
    inputs:
      world:
        description: "World id (folder under worlds/)"
        required: true
      story:
        description: "Story id (folder under worlds/<world>/stories/)"
        required: true

permissions:
  contents: write

jobs:
  art:
    runs-on: ubuntu-latest
    env:
      WORLD: ${{ inputs.world }}
      STORY: ${{ inputs.story }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Cairo
        run: sudo apt-get update && sudo apt-get install -y libcairo2
      - name: Install the toolchain with the images extra
        run: pip install -e ".[dev,render,images]"
      - name: Generate the missing art
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python -m build generate-images --root . --world "$WORLD" --story "$STORY"
      - name: Rebuild the library and the README catalogue
        run: python -m build rebuild --root .
      - name: Commit the art and kits
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add worlds kits README.md
          git commit -m "art: generate illustrations and rebuild kits for ${WORLD}/${STORY}" || echo "nothing to commit"
          git push
